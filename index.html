<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Прайс RTL · вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1c33; --red:#e30613; --muted:#5b6b7c; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:Montserrat,system-ui,sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(227,6,19,.12), transparent 55%),
        linear-gradient(165deg, #f7f9fc, #e8eef6 55%, #f3f6fa);
      display:grid; place-items:center; padding:24px; color:var(--navy);
    }
    .card {
      width:min(420px,100%); background:#fff; border:1px solid #d9e0ea;
      border-radius:18px; padding:28px 26px 24px; box-shadow:0 18px 50px rgba(11,28,51,.08);
    }
    h1 { margin:0 0 6px; font-size:22px; font-weight:800; letter-spacing:-.03em; }
    p { margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.45; }
    label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:6px; }
    input {
      width:100%; border:1px solid #c9d3e0; border-radius:12px; padding:12px 14px;
      font:inherit; font-size:15px; outline:none; background:#fbfcfe;
    }
    input:focus { border-color:var(--navy); box-shadow:0 0 0 3px rgba(11,28,51,.12); }
    button {
      margin-top:14px; width:100%; border:0; border-radius:12px; padding:12px 14px;
      background:var(--navy); color:#fff; font:inherit; font-weight:700; cursor:pointer;
    }
    button:hover { background:#132744; }
    .err { display:none; margin-top:12px; color:var(--red); font-size:13px; font-weight:600; }
    .err.show { display:block; }
    .hint { margin-top:14px; font-size:11px; color:#8a97a8; }
  </style>
</head>

    <p>Оптовый прайс Rustrans-Logistic, склад Москва. Введите пароль, чтобы скачать Excel и PDF.</p>

      <button type="submit">Войти</button>
      <div class="err" id="err">Неверный пароль</div>
    </form>
    <div class="hint">Сессия только в этой вкладке · без пароля файлы не читаются</div>

rN';
    const ITERATIONS = 200000;
    const SECURE_VIEW_URL = 'https://carownertop.github.io/rustrans-send-view/';
    const REMEMBER_DAYS = 7;
    const PW_COOKIE = "rtl_send_pw";

    function setPwCookie(pw) {
      const maxAge = REMEMBER_DAYS * 24 * 60 * 60;
      const secure = location.protocol === "https:" ? "; Secure" : "";
      document.cookie = PW_COOKIE + "=" + encodeURIComponent(pw)
        + "; Max-Age=" + maxAge + "; Path=/; SameSite=Lax" + secure;
    }
    function getPwCookie() {
      const parts = document.cookie.split(";");
      for (const raw of parts) {
        const p = raw.trim();
        if (p.startsWith(PW_COOKIE + "=")) return decodeURIComponent(p.slice(PW_COOKIE.length + 1));
      }
      return "";
    }
    function clearPwCookie() {
      document.cookie = PW_COOKIE + "=; Max-Age=0; Path=/; SameSite=Lax";
    }

    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const errEl = document.getElementById("err");

    function showErr(msg) {
      errEl.textContent = msg;
      errEl.classList.add("show");
    }

    function cryptoOk() {
      return !!(window.isSecureContext && window.crypto && window.crypto.subtle);
    }

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt, iterations:ITERATIONS, hash:"SHA-256" },
        base,
        { name:"AES-GCM", length:256 },
        false,
        ["decrypt"]
      );
    }

    function renderDoc(html) {
      // Ровно один рендер за жизнь страницы. unlock() могут дёрнуть дважды
      // (сохранённый cookie + разблокировка через хаб). Повторный проход
      // заново исполнял инлайновый <script> фильтра → "Identifier ... has
      // already been declared" → обработчики дат не навешивались и таблица
      // показывала все строки независимо от выбранной даты.
      if (window.__vitrinaRendered) return;
      // head/body заменяем напрямую и пересоздаём <script>, иначе importNode
      // их не запускает. document.write() как fallback убран — в части
      // браузеров инлайн-скрипты после загрузки не исполняются.
      var doc = new DOMParser().parseFromString(html, "text/html");
      if (!doc || !doc.body) { console.error("renderDoc: parse failed"); return; }
      window.__vitrinaRendered = true;
      document.documentElement.replaceChild(document.importNode(doc.head, true), document.head);
      document.documentElement.replaceChild(document.importNode(doc.body, true), document.body);
      if (doc.title) { try { document.title = doc.title; } catch (e) {} }
      var olds = document.querySelectorAll("script");
      for (var i = 0; i < olds.length; i++) {
        var old = olds[i];
        var s = document.createElement("script");
        for (var j = 0; j < old.attributes.length; j++) {
          s.setAttribute(old.attributes[j].name, old.attributes[j].value);
        }
        s.textContent = old.textContent;
        try { old.parentNode.replaceChild(s, old); } catch (e) { console.error("renderDoc script", e); }
      }
    }

    async function unlock(password) {
      if (!cryptoOk()) {
        throw new Error("INSECURE_CONTEXT");
      }
      const salt = b64(SALT_B64);
      const iv = b64(IV_B64);
      const data = b64(DATA_B64);
      const key = await deriveKey(password, salt);
      const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, data);
      const html = new TextDecoder().decode(plain);
      setPwCookie(password);
      renderDoc(html);
    }

    if (!cryptoOk()) {
      showErr("Нужен HTTPS. Откройте: " + SECURE_VIEW_URL);
    }

    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.classList.remove("show");
      errEl.textContent = "Неверный пароль";
      const password = document.getElementById("p").value;
      try {
        await unlock(password);
      } catch (ex) {
        clearPwCookie();
        if (ex && ex.message === "INSECURE_CONTEXT") {
          showErr("Нужен HTTPS. Откройте: " + SECURE_VIEW_URL);
        } else {
          showErr("Неверный пароль");
        }
      }
    });

    (async () => {
      const saved = getPwCookie();
      if (!saved || !cryptoOk()) return;
      try { await unlock(saved); } catch (e) { clearPwCookie(); }
    })();
  </script>
